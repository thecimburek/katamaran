<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katamarán 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EEF4F6; --ink:#10293A; --muted:#567183; --line:#D3E0E6; --card:#FFFFFF;
  --yes:#0B7F62; --yes-soft:#D4F1E7; --no:#A8404F; --no-soft:#F7DDE1;
  --sky1:#140F3A; --sky2:#3B1C5E; --sea:#0E3A5A; --sea2:#0A2A44;
  --sand1:#E2C48C; --sand2:#CFA866; --sand-ink:#3B2A12;
  --bulb1:#FFC93C; --bulb2:#FF5C8A; --bulb3:#5CE1E6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1720; --ink:#E4EFF4; --muted:#8EA8B6; --line:#1E3443; --card:#10222D;
    --yes:#41C9A0; --yes-soft:#0F3A2E; --no:#E8899A; --no-soft:#3D1B22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1720; --ink:#E4EFF4; --muted:#8EA8B6; --line:#1E3443; --card:#10222D;
  --yes:#41C9A0; --yes-soft:#0F3A2E; --no:#E8899A; --no-soft:#3D1B22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased}
#root{max-width:980px;margin:0 auto;padding:20px 16px 48px}

.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin:4px 4px 18px}
.top h1{margin:0;font-size:clamp(2.2rem,7vw,3.6rem);line-height:.95;font-weight:800;letter-spacing:-.03em;
  font-variation-settings:"opsz" 96}
.lede{margin:6px 0 0;color:var(--muted);max-width:42ch}
.tally{margin:0;font-size:1.05rem;color:var(--muted)}
.tally b{color:var(--ink);font-size:1.5rem;font-weight:800}

/* ---------- scene ---------- */
.scene{border-radius:28px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.sky{position:relative;padding:22px 12px 0;
  background:
    radial-gradient(1.6px 1.6px at 8% 14%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 22% 32%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 37% 9%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 63% 22%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 78% 8%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 91% 30%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 52% 38%,#ffffffaa,transparent),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
.moon{position:absolute;top:22px;right:7%;width:46px;height:46px;border-radius:50%;
  background:#FFF4D6;box-shadow:0 0 40px 8px #fff4d655}
.zone-title{position:relative;z-index:3;margin:0 0 0 8px;font-size:1.05rem;font-weight:700;color:#F5EFFF}
.zone-title span{opacity:.7;font-weight:500}
.boat-wrap{overflow:hidden}
.boat{position:relative;width:min(900px,max(100%,480px));margin:0 0 0 calc((100% - min(900px,max(100%,480px)))/2);aspect-ratio:900/400;container-type:inline-size;
  animation:bob 4.5s ease-in-out infinite}
.boat>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.crew{position:absolute;left:11%;right:11%;bottom:26%;display:flex;justify-content:center;align-items:flex-end;z-index:2}
.crew .fig{flex:0 1 min(7.4cqw,78px);min-width:0;margin:0 .1cqw}
.crew .tag{max-width:100%;overflow:hidden;text-overflow:clip}
@container (max-width:640px){.crew.many .tag{display:none}}
.crew .fig svg{animation:dance 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.crew .fig:nth-child(2n) svg{animation-delay:-.55s}
.crew .fig:nth-child(3n) svg{animation-duration:.9s}
.fig{display:flex;flex-direction:column;align-items:center}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.tag{font-size:clamp(.58rem,1.6cqw,.82rem);font-weight:700;white-space:nowrap;margin-top:2px;line-height:1.1}
.crew .tag{color:#F5EFFF;background:#140F3Ad9;padding:1px 5px;border-radius:6px;font-size:clamp(.56rem,1.5cqw,.78rem)}
.empty-deck{position:absolute;left:0;right:0;bottom:44%;text-align:center;color:#F5EFFFcc;font-size:clamp(.85rem,2.4cqw,1.1rem);z-index:2}
.bulb{animation:blink 1.6s steps(2,jump-none) infinite}
.bulb:nth-of-type(3n){animation-delay:-.5s}
.bulb:nth-of-type(3n+1){animation-delay:-1.1s}
.sea{height:34px;background:linear-gradient(180deg,var(--sea),var(--sea2))}

.land{position:relative;padding:44px 12px 26px;background:linear-gradient(180deg,var(--sand1),var(--sand2));color:var(--sand-ink)}
.shore{position:absolute;top:-1px;left:0;width:100%;height:30px;display:block}
.land .zone-title{color:var(--sand-ink)}
.palm{position:absolute;right:2%;bottom:0;width:min(150px,22%);height:auto;opacity:.9;pointer-events:none}
.ashore{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;margin-top:10px;padding-right:min(120px,14%);position:relative;z-index:1}
.ashore .fig{width:118px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:16px}
.ashore .fig:focus-visible{outline:3px solid var(--sand-ink);outline-offset:4px}
.ashore .fig svg{width:56px}
.ashore .tag{font-size:.82rem}
.bubble{position:relative;background:#fff;color:#1E1A2E;border-radius:16px;padding:5px 10px 6px;margin-bottom:9px;
  font-family:"Caveat","Comic Sans MS","Segoe Print",cursive;font-weight:700;font-size:1.22rem;line-height:1.05;
  text-align:center;box-shadow:0 2px 0 #0000001f;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.all-aboard{margin:14px auto 6px;text-align:center;font-weight:600;max-width:30ch}

/* ---------- roster ---------- */
.roster{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 8px}
.roster h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.status{margin:2px 0 10px;color:var(--muted);font-size:.92rem;min-height:1.4em}
.status.warn{color:var(--no)}
.roster ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chip{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{flex:none;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-weight:700;font-size:.88rem;border:0;background:transparent;color:var(--muted);
  padding:6px 14px;border-radius:999px;cursor:pointer;min-width:52px}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--yes);color:#fff}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--no);color:#fff}
.seg button:disabled{cursor:default}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(6px) rotate(.4deg)}}
@keyframes dance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6%) rotate(3deg)}}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .boat,.crew .fig svg,.bulb{animation:none}
}
@media (max-width:560px){
  #root{padding:14px 10px 40px}
  .scene{border-radius:20px}
  .moon{width:32px;height:32px}
  .ashore{padding-right:0}
  .ashore .fig{width:104px}
  .bubble{font-size:1.08rem}
  .palm{opacity:.45}
  .seg button{padding:6px 11px;min-width:46px}
}
</style>
</head>
<body>
<main id="root"></main>
<script type="application/json" id="state">{"people":[{"name":"Dominik Chmelař","yes":false},{"name":"Filip Libánský","yes":true},{"name":"Jan Panna","yes":false},{"name":"Lukáš Cimburek","yes":false},{"name":"Matěj Procházka","yes":false},{"name":"Michal Hašto","yes":false},{"name":"Rade Šindelář","yes":false},{"name":"Tomáš Cimburek","yes":true},{"name":"Tomáš Mareček","yes":true},{"name":"Vojta Hanuš","yes":false}]}</script>
<script id="app">
(function(){
  var PHRASES = ['Moc se neožerte!', 'Tak si to užijte!', 'Pozdravujte holky!', 'Moc nezlobte!', 'Kéž bych měl taky koule…', 'Achjó, já chci taky!', 'Pošlete fotky!', 'Příště jedu i já!', 'Hlavně nikoho nevylovte!', 'Ať vám neuplave kotva!'];
  var SHIRTS = ['#E4572E','#2E86AB','#F2A541','#7B2CBF','#17A398','#D62868','#3D5A80','#8AB17D','#C05746','#4F6D7A'];
  var HAIR = ['#2B1B12','#5A3A22','#1C1C1C','#7A5230','#3B2A1A'];
  var SKIN = ['#F1C9A5','#E8B88F','#F4D2B4','#DDA97F'];

  var state = JSON.parse(document.getElementById('state').textContent);
  var root = document.getElementById('root');
  var phraseShift = {};
  var saveTimer = null;
  var status = { text: '', warn: false };

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function parts(n){ var a = n.split(' '); return { first: a[0], last: a.slice(1).join(' ') }; }
  function shortName(n){ var p = parts(n); return p.first + (p.last ? ' ' + p.last.charAt(0) + '.' : ''); }
  function initials(n){ var p = parts(n); return (p.first.charAt(0) + (p.last ? p.last.charAt(0) : '')).toUpperCase(); }

  function figure(i, onBoat){
    var shirt = SHIRTS[i % SHIRTS.length], hair = HAIR[i % HAIR.length], skin = SKIN[i % SKIN.length];
    var ini = initials(state.people[i].name);
    var arms = onBoat
      ? '<path d="M17 46 Q8 36 9 22" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<rect x="3.5" y="9" width="11" height="14" rx="2" fill="#FFC93C"/><rect x="3.5" y="9" width="11" height="4" rx="1.5" fill="#FFF7D6"/>' +
        '<path d="M43 46 Q52 54 50 66" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>'
      : '<path d="M17 46 Q9 56 11 68" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<path d="M43 46 Q53 36 51 22" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<circle cx="51" cy="19" r="4.5" fill="'+skin+'"/>';
    var face = onBoat
      ? '<rect x="18" y="20" width="10" height="6" rx="2.5" fill="#111"/><rect x="32" y="20" width="10" height="6" rx="2.5" fill="#111"/><rect x="27" y="21.5" width="6" height="1.6" fill="#111"/>' +
        '<path d="M24 31 Q30 36 36 31" stroke="#5B2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>'
      : '<circle cx="24.5" cy="23" r="1.8" fill="#2A1A10"/><circle cx="35.5" cy="23" r="1.8" fill="#2A1A10"/>' +
        '<path d="M25 31 Q30 33.5 35 31" stroke="#5B2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 60 100" aria-hidden="true">' +
      '<rect x="20" y="72" width="8" height="26" rx="3" fill="#22303A"/><rect x="32" y="72" width="8" height="26" rx="3" fill="#22303A"/>' +
      arms +
      '<rect x="15" y="40" width="30" height="36" rx="10" fill="'+shirt+'"/>' +
      '<text x="30" y="63" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="inherit">'+esc(ini)+'</text>' +
      '<circle cx="30" cy="24" r="14" fill="'+skin+'"/>' +
      '<path d="M16 22 Q17 8 30 9 Q43 8 44 22 Q38 14 30 15 Q22 14 16 22Z" fill="'+hair+'"/>' +
      face + '</svg>';
  }

  function quad(p0, p1, p2, t){
    var u = 1 - t;
    return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]];
  }

  function rig(){
    var top = [450, 36], L = [62, 296], R = [838, 296], cL = [250, 210], cR = [650, 210];
    var colors = ['var(--bulb1)','var(--bulb2)','var(--bulb3)'];
    var bulbs = '', k = 0;
    [[L, cL], [R, cR]].forEach(function(side){
      for (var t = 0.08; t < 0.97; t += 0.075){
        var p = quad(top, side[1], side[0], t);
        var c = colors[k++ % 3];
        bulbs += '<circle class="bulb" cx="'+p[0].toFixed(1)+'" cy="'+(p[1]+5).toFixed(1)+'" r="6" fill="'+c+'" style="filter:drop-shadow(0 0 6px '+c+')"/>';
      }
    });
    return '<svg viewBox="0 0 900 400" aria-hidden="true">' +
      '<line x1="450" y1="26" x2="450" y2="300" stroke="#E6ECF2" stroke-width="7" stroke-linecap="round"/>' +
      '<path d="M450 30 L470 40 L450 50Z" fill="#FF5C8A"/>' +
      '<path d="M'+top+' Q'+cL+' '+L+'" stroke="#0006" stroke-width="2" fill="none"/>' +
      '<path d="M'+top+' Q'+cR+' '+R+'" stroke="#0006" stroke-width="2" fill="none"/>' +
      bulbs +
      '<rect x="290" y="252" width="320" height="50" rx="16" fill="#DCE5EC"/>' +
      '<rect x="318" y="264" width="64" height="16" rx="7" fill="#22304A"/><rect x="418" y="264" width="64" height="16" rx="7" fill="#22304A"/><rect x="518" y="264" width="64" height="16" rx="7" fill="#22304A"/>' +
      '<path d="M70 312 L880 306 Q890 306 872 340 L150 352 Q96 352 70 312Z" fill="#B9C7D3"/>' +
      '<rect x="36" y="294" width="836" height="20" rx="8" fill="#F7FAFC"/>' +
      '<path d="M24 314 L874 314 Q890 314 866 356 L118 368 Q58 368 24 314Z" fill="#FFFFFF"/>' +
      '<path d="M40 330 L862 330" stroke="#17A398" stroke-width="7"/>' +
      '</svg>' +
      '<svg viewBox="0 0 900 400" aria-hidden="true" style="z-index:3;pointer-events:none">' +
      '<path d="M0 352 Q45 338 90 352 T180 352 T270 352 T360 352 T450 352 T540 352 T630 352 T720 352 T810 352 T900 352 V400 H0Z" fill="#0E3A5A" opacity=".55"/>' +
      '<path d="M0 362 Q60 350 120 362 T240 362 T360 362 T480 362 T600 362 T720 362 T840 362 T960 362 V400 H0Z" fill="#0E3A5A"/>' +
      '</svg>';
  }

  var PALM = '<svg class="palm" viewBox="0 0 150 200" aria-hidden="true"><path d="M78 200 Q70 130 84 70" stroke="#5B3E1E" stroke-width="10" fill="none" stroke-linecap="round"/>' +
    '<path d="M84 70 Q50 40 10 58 Q48 52 84 72Z" fill="#2F5D3A"/><path d="M84 70 Q110 30 146 40 Q112 46 86 72Z" fill="#2F5D3A"/>' +
    '<path d="M84 70 Q60 20 70 0 Q76 34 88 70Z" fill="#3B7347"/><path d="M84 70 Q130 70 140 100 Q118 80 84 72Z" fill="#3B7347"/>' +
    '<path d="M84 70 Q40 78 30 108 Q52 84 84 72Z" fill="#2F5D3A"/><circle cx="80" cy="76" r="5" fill="#6B4A22"/><circle cx="90" cy="78" r="5" fill="#6B4A22"/></svg>';

  function render(){
    var focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : null;
    var people = state.people, yes = [], no = [];
    people.forEach(function(p, i){ (p.yes ? yes : no).push(i); });

    var crew = yes.map(function(i){
      return '<div class="fig">' + figure(i, true) + '<span class="tag">' + esc(shortName(people[i].name)) + '</span></div>';
    }).join('');

    var used = {};
    var ashore = no.map(function(i, n){
      var idx = (n + (phraseShift[i] || 0)) % PHRASES.length, tries = 0;
      while (used[idx] && tries < PHRASES.length){ idx = (idx + 1) % PHRASES.length; tries++; }
      used[idx] = true;
      var ph = PHRASES[idx];
      return '<button class="fig" type="button" data-shout="'+i+'" data-focus="s'+i+'" aria-label="'+esc(people[i].name)+': '+esc(ph)+'">' +
        '<span class="bubble">' + esc(ph) + '</span>' + figure(i, false) +
        '<span class="tag">' + esc(shortName(people[i].name)) + '</span></button>';
    }).join('');

    var rows = people.map(function(p, i){
      var dis = '';
      return '<li class="row"><span class="chip" style="background:'+SHIRTS[i % SHIRTS.length]+'">'+esc(initials(p.name))+'</span>' +
        '<span class="nm">'+esc(p.name)+'</span>' +
        '<div class="seg" role="group" aria-label="Hlas: '+esc(p.name)+'">' +
        '<button type="button" data-i="'+i+'" data-v="1" data-focus="y'+i+'" aria-pressed="'+(p.yes)+'"'+dis+'>ANO</button>' +
        '<button type="button" data-i="'+i+'" data-v="0" data-focus="n'+i+'" aria-pressed="'+(!p.yes)+'"'+dis+'>NE</button>' +
        '</div></li>';
    }).join('');

    root.innerHTML =
      '<header class="top"><div><h1>Katamarán 2027</h1>' +
      '<p class="lede">Kdo dá ANO, nalodí se a jde se slavit. Kdo zatím ne, mává ze břehu.</p></div>' +
      '<p class="tally">Na palubě <b>' + yes.length + '</b> z ' + people.length + '</p></header>' +
      '<section class="scene">' +
        '<div class="sky" aria-label="Na lodi"><div class="moon"></div>' +
          '<h2 class="zone-title">Na lodi <span>(' + yes.length + ')</span></h2>' +
          '<div class="boat-wrap"><div class="boat">' + rig() +
            (yes.length ? '<div class="crew' + (yes.length > 6 ? ' many' : '') + '">' + crew + '</div>' : '<p class="empty-deck">Paluba je zatím prázdná.</p>') +
          '</div></div></div>' +
        '<div class="sea"></div>' +
        '<div class="land" aria-label="Na souši">' +
          '<svg class="shore" viewBox="0 0 900 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H900 V12 Q800 26 700 14 T500 16 T300 12 T100 18 T0 12Z" fill="#0A2A44"/></svg>' +
          '<h2 class="zone-title">Na souši <span>(' + no.length + ')</span></h2>' +
          (no.length ? '<div class="ashore">' + ashore + '</div>'
                     : '<p class="all-aboard">Všichni jedou. Na břehu nezůstal nikdo, kdo by mával.</p>') +
          PALM +
        '</div>' +
      '</section>' +
      '<section class="roster"><h2>Kdo jede?</h2>' +
      '<p class="status' + (status.warn ? ' warn' : '') + '" aria-live="polite">' + esc(status.text) + '</p>' +
      '<ul>' + rows + '</ul></section>';

    if (focused){
      var el = root.querySelector('[data-focus="' + focused + '"]');
      if (el) el.focus();
    }
  }

  function setStatus(text, warn){ status = { text: text, warn: !!warn }; var s = root.querySelector('.status'); if (s){ s.textContent = text; s.classList.toggle('warn', !!warn); } }

  var api = false, saving = false, pending = false;

  function getPin(){
    try { return localStorage.getItem('katamaran-pin') || ''; } catch(e){ return ''; }
  }
  function setPin(v){
    try { if (v) localStorage.setItem('katamaran-pin', v); else localStorage.removeItem('katamaran-pin'); } catch(e){}
  }

  function load(){
    return fetch('/api/state', { cache: 'no-store' }).then(function(r){
      if (!r.ok) throw new Error('http ' + r.status);
      return r.json();
    }).then(function(data){
      api = true;
      if (data && Array.isArray(data.people) && data.people.length){ state = data; render(); }
    }).catch(function(){
      api = false;
      setStatus('Ukládání teď nefunguje, změny uvidíš jen ty.', true);
    });
  }

  function scheduleSave(){
    if (!api){ setStatus('Ukládání teď nefunguje, změny uvidíš jen ty.', true); return; }
    var pin = getPin();
    if (!pin){
      pin = window.prompt('Zadej PIN pro úpravu hlasů:') || '';
      if (!pin){ setStatus('Bez PINu se změna neuloží.', true); load(); return; }
      setPin(pin);
    }
    clearTimeout(saveTimer);
    setStatus('Ukládám…');
    saveTimer = setTimeout(save, 700);
  }

  function save(){
    saveTimer = null;
    if (saving){ pending = true; return; }
    saving = true;
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Edit-Pin': getPin() },
      body: JSON.stringify(state)
    }).then(function(r){
      if (r.status === 401){ setPin(''); setStatus('Špatný PIN, změna se neuložila.', true); return load(); }
      if (!r.ok) throw new Error('http ' + r.status);
      setStatus('Uloženo.');
    }).catch(function(){
      setStatus('Uložení se nepovedlo. Zkus to znovu.', true);
    }).then(function(){
      saving = false;
      if (pending){ pending = false; save(); }
    });
  }

  root.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.shout !== undefined){
      var i = +b.dataset.shout; phraseShift[i] = (phraseShift[i] || 0) + 1; render(); return;
    }
    if (b.dataset.i !== undefined){
      var p = state.people[+b.dataset.i], v = b.dataset.v === '1';
      if (p.yes === v) return;
      p.yes = v; render(); scheduleSave();
    }
  });

  render();
  load();
  setInterval(function(){ if (!saving && !saveTimer) load(); }, 30000);
})();
</script>
</body>
</html>
