<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Katamarán 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#EEF4F6; --ink:#10293A; --muted:#567183; --line:#D3E0E6; --card:#FFFFFF;
  --yes:#0B7F62; --yes-soft:#D4F1E7; --no:#A8404F; --no-soft:#F7DDE1;
  --sky1:#140F3A; --sky2:#3B1C5E; --sea:#0E3A5A; --sea2:#0A2A44;
  --sand1:#E2C48C; --sand2:#CFA866; --sand-ink:#3B2A12;
  --bulb1:#FFC93C; --bulb2:#FF5C8A; --bulb3:#5CE1E6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1720; --ink:#E4EFF4; --muted:#8EA8B6; --line:#1E3443; --card:#10222D;
    --yes:#41C9A0; --yes-soft:#0F3A2E; --no:#E8899A; --no-soft:#3D1B22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1720; --ink:#E4EFF4; --muted:#8EA8B6; --line:#1E3443; --card:#10222D;
  --yes:#41C9A0; --yes-soft:#0F3A2E; --no:#E8899A; --no-soft:#3D1B22;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45;-webkit-font-smoothing:antialiased}
#root{max-width:980px;margin:0 auto;padding:20px 16px 48px}

.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin:4px 4px 18px}
.top h1{margin:0;font-size:clamp(2.2rem,7vw,3.6rem);line-height:.95;font-weight:800;letter-spacing:-.03em;
  font-variation-settings:"opsz" 96}
.lede{margin:6px 0 0;color:var(--muted);max-width:42ch}
.top-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.game-link{font-family:inherit;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.98rem;text-decoration:none;
  background:#FFC93C;color:#1E1A2E;border-radius:999px;padding:9px 18px;box-shadow:0 2px 0 #C9932A}
.game-link,.tally{white-space:nowrap}
.game-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.game-link:hover{background:#FFD55E}
.game-link:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
@media (max-width:560px){.top-side{align-items:flex-start;width:100%}.game-links{justify-content:flex-start}.game-link{font-size:.92rem;padding:8px 14px}}
.tally{margin:0;font-size:1.05rem;color:var(--muted)}
.tally b{color:var(--ink);font-size:1.5rem;font-weight:800}

/* ---------- scene ---------- */
.scene{border-radius:28px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.sky{position:relative;padding:22px 12px 0;
  background:
    radial-gradient(1.6px 1.6px at 8% 14%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 22% 32%,#fff,transparent),
    radial-gradient(1.4px 1.4px at 37% 9%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 63% 22%,#fff,transparent),
    radial-gradient(1.6px 1.6px at 78% 8%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 91% 30%,#fff,transparent),
    radial-gradient(1.2px 1.2px at 52% 38%,#ffffffaa,transparent),
    linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 100%)}
.moon{position:absolute;top:22px;right:7%;width:46px;height:46px;border-radius:50%;
  background:#FFF4D6;box-shadow:0 0 40px 8px #fff4d655}
.zone-title{position:relative;z-index:3;margin:0 0 0 8px;font-size:1.05rem;font-weight:700;color:#F5EFFF}
.zone-title span{opacity:.7;font-weight:500}
.boat-wrap{overflow:hidden;max-width:940px;margin:0 auto}
.boat{position:relative;width:min(940px,100%);margin:0 0 0 calc(100% - min(940px,100%));aspect-ratio:940/400;container-type:inline-size;
  animation:bob 4.5s ease-in-out infinite}
.boat>svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.crew{position:absolute;left:25%;right:22%;gap:1.2cqw;bottom:25.8%;display:flex;justify-content:center;align-items:flex-end;z-index:2}
.crew .fig{flex:0 1 min(7.4cqw,78px);min-width:0}
.crew.many .tag{display:none}
@container (max-width:640px){.crew .fig:nth-child(even) .tag{top:auto;bottom:100%;margin:0 0 3px}}
.crew .fig svg{animation:dance 1.1s ease-in-out infinite alternate;transform-origin:50% 100%}
.crew .fig:nth-child(2n) svg{animation-delay:-.55s}
.crew .fig:nth-child(3n) svg{animation-duration:.9s}
.fig{display:flex;flex-direction:column;align-items:center}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.tag{font-size:clamp(.58rem,1.6cqw,.82rem);font-weight:700;white-space:nowrap;margin-top:2px;line-height:1.1}
.crew .fig{position:relative}
.crew .tag{position:absolute;top:100%;left:50%;margin:3px 0 0;translate:-50% 0;color:#F5EFFF;background:#140F3Ad9;padding:1px 5px;border-radius:6px;font-size:clamp(.56rem,1.5cqw,.78rem)}
.empty-deck{position:absolute;left:0;right:0;bottom:44%;text-align:center;color:#F5EFFFcc;font-size:clamp(.85rem,2.4cqw,1.1rem);z-index:2}
.poop{animation:drop 1.8s cubic-bezier(.5,0,1,1) infinite}
.poop.p2{animation-delay:-.6s}.poop.p3{animation-delay:-1.2s}
.stink{animation:stink 2.2s ease-in-out infinite}.stink.s2{animation-delay:-1.1s}
.splash{animation:splash 1.8s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.smoke{animation:smoke 2.4s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}.smoke.s2{animation-delay:-1.2s}
.ember{animation:blink 1.2s ease-in-out infinite alternate}
.bulb{animation:blink 1.6s steps(2,jump-none) infinite}
.bulb:nth-of-type(3n){animation-delay:-.5s}
.bulb:nth-of-type(3n+1){animation-delay:-1.1s}
.sea{height:34px;background:linear-gradient(180deg,var(--sea),var(--sea2))}

.land{position:relative;padding:44px 12px 26px;background:linear-gradient(180deg,var(--sand1),var(--sand2));color:var(--sand-ink)}
.shore{position:absolute;top:-1px;left:0;width:100%;height:30px;display:block}
.land .zone-title{color:var(--sand-ink)}
.palm{position:absolute;right:2%;bottom:0;width:min(150px,22%);height:auto;opacity:.9;pointer-events:none}
.ashore{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;margin-top:10px;padding-right:min(120px,14%);position:relative;z-index:1}
.ashore .fig{width:118px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:16px}
.ashore .fig:focus-visible{outline:3px solid var(--sand-ink);outline-offset:4px}
.ashore .fig svg{width:56px}
.ashore .tag{font-size:.82rem}
.bubble{position:relative;background:#fff;color:#1E1A2E;border-radius:16px;padding:5px 10px 6px;margin-bottom:9px;
  font-family:"Caveat","Comic Sans MS","Segoe Print",cursive;font-weight:700;font-size:1.22rem;line-height:1.05;
  text-align:center;box-shadow:0 2px 0 #0000001f;min-height:2.3em;display:flex;align-items:center;justify-content:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.all-aboard{margin:14px auto 6px;text-align:center;font-weight:600;max-width:30ch}

/* ---------- roster ---------- */
.roster{margin-top:26px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 18px 8px}
.roster h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.status{margin:2px 0 10px;color:var(--muted);font-size:.92rem;min-height:1.4em}
.status.warn{color:var(--no)}
.badge{flex:none;font-weight:700;font-size:.88rem;padding:5px 14px;border-radius:999px;min-width:56px;text-align:center}
.b-yes{background:var(--yes);color:#fff}
.b-no{background:var(--no-soft);color:var(--no)}
.roster-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.reset{font:inherit;font-weight:600;font-size:.88rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.reset:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.roster ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chip{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.78rem}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{flex:none;display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{font:inherit;font-weight:700;font-size:.88rem;border:0;background:transparent;color:var(--muted);
  padding:6px 14px;border-radius:999px;cursor:pointer;min-width:52px}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg button[data-v="1"][aria-pressed="true"]{background:var(--yes);color:#fff}
.seg button[data-v="0"][aria-pressed="true"]{background:var(--no);color:#fff}
.seg button:disabled{cursor:default}


/* ---------- minihra ---------- */
.game-modal{padding:0;border:0;background:transparent;width:min(680px,calc(100vw - 24px));max-width:none;max-height:calc(100dvh - 24px);overflow:auto;color:var(--ink)}
.game-modal::backdrop{background:#0B0820b8;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.game-modal[open]{animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
body:has(dialog[open]){overflow:hidden}
.game-wrap{margin:0;padding:0}
.game{position:relative}
.game-head{padding-right:44px}
.modal-x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;cursor:pointer;display:grid;place-items:center;z-index:2}
.modal-x:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.game{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.game-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.game-head h2{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.game-score{margin:0;display:flex;gap:14px;color:var(--muted);font-size:.95rem}
.game-score b{color:var(--ink);font-size:1.1rem}
.game-score .pl{padding:2px 10px;border-radius:999px;white-space:nowrap}
.game-score .pl.on{background:#FFC93C;color:#1E1A2E}
.game-score .pl.on b{color:#1E1A2E}
.game-score .vs{font-weight:700}
.ov-title{font-size:1.3rem!important;font-weight:800!important;max-width:none!important}
.ov-small{font-size:.9rem!important;opacity:.8}
.ov-note{font-size:.95rem!important;font-weight:500!important;opacity:.9}
.ov-score{font-size:1.15rem!important}
.ov-field{display:flex;flex-direction:column;gap:4px;width:min(260px,100%);text-align:left;font-size:.85rem;font-weight:600;opacity:.95}
.ov-field select{font:inherit;font-size:1rem;font-weight:600;padding:9px 12px;border-radius:12px;border:1px solid #ffffff40;background:#241A4F;color:#F5EFFF}
.ov-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.overlay button.ghost{background:transparent;color:#F5EFFF;box-shadow:inset 0 0 0 2px #F5EFFF80}
.game-round{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.stage{position:relative;margin-top:12px;border-radius:18px;padding:8px 0 0;
  background:radial-gradient(120% 80% at 50% 100%,#5A2A7A 0%,#2A1650 55%,#140F3A 100%);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer;outline:none}
.stage:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.stage svg{display:block;width:100%;max-width:620px;margin:0 auto;height:auto}
#g-stage{min-height:360px;display:flex;align-items:center}
#g-stage svg{flex:1}
.stage-room{background:#EBD3A6;padding:0;overflow:hidden}
.stage-room canvas{display:block;width:100%;touch-action:none}
.overlay.count{background:#140F3A80}
.ov-count{font-size:4.5rem!important;font-weight:800!important;line-height:1;color:#FFC93C}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:#140F3Ad0;border-radius:18px;color:#F5EFFF;text-align:center;padding:20px;cursor:default}
.overlay[hidden]{display:none}
.overlay p{margin:0;max-width:28ch;font-weight:600;font-size:1.05rem}
.overlay button{font:inherit;font-weight:800;font-size:1.05rem;background:#FFC93C;color:#1E1A2E;border:0;border-radius:999px;padding:10px 28px;cursor:pointer}
.overlay button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.game-msg{margin:10px 0 0;min-height:1.5em;font-weight:700}
@media (max-width:560px){.game-modal{width:calc(100vw - 16px);max-height:calc(100dvh - 16px)}.game{padding:14px}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.4deg)}50%{transform:translateY(6px) rotate(.4deg)}}
@keyframes dance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-1.5%) rotate(3deg)}}
@keyframes drop{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(68px);opacity:1}}
@keyframes stink{0%,100%{opacity:0;transform:translateY(4px)}50%{opacity:.9;transform:translateY(-4px)}}
@keyframes splash{0%,80%{transform:scale(0);opacity:0}88%{transform:scale(1);opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes smoke{0%{opacity:0;transform:translateY(4px) scale(.8)}30%{opacity:.85}100%{opacity:0;transform:translateY(-10px) scale(1.15)}}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
@media (prefers-reduced-motion:reduce){
  .boat,.crew .fig svg,.bulb,.stink,.smoke,.ember{animation:none}
  .poop{animation:none;transform:translateY(30px)}
  .poop.p2,.poop.p3{display:none}
  .splash{animation:none;opacity:0}
}
@media (max-width:560px){
  #root{padding:14px 10px 40px}
  .scene{border-radius:20px}
  .moon{width:32px;height:32px}
  .ashore{padding-right:0}
  .ashore .fig{width:104px}
  .bubble{font-size:1.08rem}
  .palm{opacity:.45}
  .seg button{padding:6px 11px;min-width:46px}
}
</style>
</head>
<body>
<main id="root"></main>
<!-- Hlasy: u každého kluka přepiš "yes": true (ANO) nebo "yes": false (NE). -->
<script type="application/json" id="state">{"people": [
  {"name": "Dominik Chmelař", "yes": false},
  {"name": "Filip Libánský", "yes": true},
  {"name": "Jan Panna", "yes": true},
  {"name": "Lukáš Cimburek", "yes": false},
  {"name": "Matěj Procházka", "yes": false},
  {"name": "Michal Hašto", "yes": false},
  {"name": "Rade Šindelář", "yes": false},
  {"name": "Tomáš Cimburek", "yes": true},
  {"name": "Tomáš Mareček", "yes": true},
  {"name": "Vojta Hanuš", "yes": false}
]}</script>
<script id="app">
(function(){
  var PHRASES = ['Moc se neožerte!', 'Tak si to užijte!', 'Pozdravujte holky!', 'Moc nezlobte!', 'Kéž bych měl taky koule…', 'Achjó, já chci taky!', 'Pošlete fotky!', 'Příště jedu i já!', 'Hlavně nikoho nevylovte!', 'Ať vám neuplave kotva!'];
  var SHIRTS = ['#E4572E','#2E86AB','#F2A541','#7B2CBF','#17A398','#D62868','#3D5A80','#8AB17D','#C05746','#4F6D7A'];
  var HAIR = ['#2B1B12','#5A3A22','#1C1C1C','#7A5230','#3B2A1A'];
  var SKIN = ['#F1C9A5','#E8B88F','#F4D2B4','#DDA97F'];

  var state = JSON.parse(document.getElementById('state').textContent);
  var root = document.getElementById('root');
  var phraseShift = {};

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function parts(n){ var a = n.split(' '); return { first: a[0], last: a.slice(1).join(' ') }; }
  function shortName(n){ var p = parts(n); return p.first + (p.last ? ' ' + p.last.charAt(0) + '.' : ''); }
  function initials(n){ var p = parts(n); return (p.first.charAt(0) + (p.last ? p.last.charAt(0) : '')).toUpperCase(); }

  var CIG = '<g transform="rotate(-8 34 32)"><rect x="33" y="30.5" width="13" height="3" rx="1" fill="#F7F3EA"/><rect x="33" y="30.5" width="4" height="3" rx="1" fill="#D9A55B"/>' +
    '<circle cx="46.5" cy="32" r="1.8" fill="#FF6A2B" class="ember"/></g>' +
    '<path class="smoke" d="M48 28 q-3 -4 0 -8 q3 -4 0 -8" stroke="#E6E6EE" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".8"/>' +
    '<path class="smoke s2" d="M51 26 q-3 -4 0 -8 q3 -4 0 -8" stroke="#E6E6EE" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".6"/>';

  function figure(i, onBoat){
    var shirt = SHIRTS[i % SHIRTS.length], hair = HAIR[i % HAIR.length], skin = SKIN[i % SKIN.length];
    var ini = initials(state.people[i].name);
    var arms = onBoat
      ? '<path d="M17 46 Q8 36 9 22" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<rect x="3.5" y="9" width="11" height="14" rx="2" fill="#FFC93C"/><rect x="3.5" y="9" width="11" height="4" rx="1.5" fill="#FFF7D6"/>' +
        '<path d="M43 46 Q52 54 50 66" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>'
      : '<path d="M17 46 Q9 56 11 68" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<path d="M43 46 Q53 36 51 22" stroke="'+shirt+'" stroke-width="7" stroke-linecap="round" fill="none"/>' +
        '<circle cx="51" cy="19" r="4.5" fill="'+skin+'"/>';
    var face = onBoat
      ? '<rect x="18" y="20" width="10" height="6" rx="2.5" fill="#111"/><rect x="32" y="20" width="10" height="6" rx="2.5" fill="#111"/><rect x="27" y="21.5" width="6" height="1.6" fill="#111"/>' +
        '<path d="M24 31 Q30 36 36 31" stroke="#5B2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>'
      : '<circle cx="24.5" cy="23" r="1.8" fill="#2A1A10"/><circle cx="35.5" cy="23" r="1.8" fill="#2A1A10"/>' +
        '<path d="M25 31 Q30 33.5 35 31" stroke="#5B2A1A" stroke-width="2" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 60 100" aria-hidden="true">' +
      '<rect x="20" y="72" width="8" height="26" rx="3" fill="#22303A"/><rect x="32" y="72" width="8" height="26" rx="3" fill="#22303A"/>' +
      arms +
      '<rect x="15" y="40" width="30" height="36" rx="10" fill="'+shirt+'"/>' +
      '<text x="30" y="63" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" font-family="inherit">'+esc(ini)+'</text>' +
      '<circle cx="30" cy="24" r="14" fill="'+skin+'"/>' +
      '<path d="M16 22 Q17 8 30 9 Q43 8 44 22 Q38 14 30 15 Q22 14 16 22Z" fill="'+hair+'"/>' +
      face + (onBoat && state.people[i].name === 'Jan Panna' ? CIG : '') + '</svg>';
  }

  function quad(p0, p1, p2, t){
    var u = 1 - t;
    return [u*u*p0[0] + 2*u*t*p1[0] + t*t*p2[0], u*u*p0[1] + 2*u*t*p1[1] + t*t*p2[1]];
  }

  function rig(dom){
    var top = [450, 36], L = [62, 296], R = [838, 296], cL = [250, 210], cR = [650, 210];
    var colors = ['var(--bulb1)','var(--bulb2)','var(--bulb3)'];
    var bulbs = '', k = 0;
    [[L, cL], [R, cR]].forEach(function(side){
      for (var t = 0.08; t < 0.97; t += 0.075){
        var p = quad(top, side[1], side[0], t);

      '<path d="M40 330 L862 330" stroke="#17A398" stroke-width="7"/>' +
      '<g transform="translate(144 294) scale(1.35) translate(-134 -294)">' +
      '<rect x="126" y="232" width="14" height="9" rx="2" fill="#2A2F36"/>' +
      '<path d="M138 236 Q172 222 178 262" stroke="#2A2F36" stroke-width="3" fill="none"/>' +
      '<rect x="112" y="240" width="44" height="54" rx="7" fill="#BCC6CF"/>' +
      '<rect x="119" y="244" width="6" height="46" rx="3" fill="#FFFFFF" opacity=".55"/>' +

      '<path d="M168 276 L188 276 L185 294 L171 294Z" fill="#FFC93C"/><ellipse cx="178" cy="276" rx="11" ry="4" fill="#FFF7E0"/></g>' +
      '<g transform="translate(782 294) scale(1.25) translate(-782 -294)">' + bottle(744, '#B5651D') + bottle(770, '#CFE8F2') + bottle(796, '#3E8E4E') + '</g>' +
      (dom != null ? dominik(dom) : '') +
      '</svg>' +
      '<svg viewBox="0 0 940 400" aria-hidden="true" style="z-index:3;pointer-events:none">' +
      '<path d="M0 352 Q45 338 90 352 T180 352 T270 352 T360 352 T450 352 T540 352 T630 352 T720 352 T810 352 T900 352 T990 352 V400 H0Z" fill="#0E3A5A" opacity=".55"/>' +
      '<path d="M0 362 Q60 350 120 362 T240 362 T360 362 T480 362 T600 362 T720 362 T840 362 T960 362 V400 H0Z" fill="#0E3A5A"/>' +
      (dom != null ? '<g class="splash"><path d="M892 356 l-6 -12 M900 354 l0 -14 M908 356 l6 -12" stroke="#BFE6FF" stroke-width="3" stroke-linecap="round"/></g>' : '') +

  function bottle(x, color){

  function dominik(i){
    var shirt = SHIRTS[i % SHIRTS.length], hair = HAIR[i % HAIR.length], skin = SKIN[i % SKIN.length];
    return '<g transform="translate(868 294) scale(1.3) translate(-868 -294)">' +
      '<path class="stink" d="M884 246 q-5 -7 0 -14 q5 -7 0 -14" stroke="#8BC34A" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +

      '<path d="M862 200 q3 5 0 7 q-3 -2 0 -7Z" fill="#7FD3F5"/>' +
      '<rect x="826" y="176" width="54" height="15" rx="6" fill="#140F3A" opacity=".85"/>' +
      '<text x="853" y="187" text-anchor="middle" font-size="10" font-weight="700" fill="#F5EFFF" font-family="Bricolage Grotesque, sans-serif">Dominik</text>' +

      '</g>';
  }

  function poop(x, y, cls){
    return '<g class="poop '+cls+'"><ellipse cx="'+x+'" cy="'+y+'" rx="6" ry="3.6" fill="#6B3E1F"/>' +
      '<ellipse cx="'+x+'" cy="'+(y-3.5)+'" rx="4.3" ry="3" fill="#7A4825"/>' +
      '<ellipse cx="'+x+'" cy="'+(y-6.5)+'" rx="2.5" ry="2.2" fill="#8A5530"/></g>';
  }

  var PALM = '<svg class="palm" viewBox="0 0 150 200" aria-hidden="true"><path d="M78 200 Q70 130 84 70" stroke="#5B3E1E" stroke-width="10" fill="none" stroke-linecap="round"/>' +
    '<path d="M84 70 Q50 40 10 58 Q48 52 84 72Z" fill="#2F5D3A"/><path d="M84 70 Q110 30 146 40 Q112 46 86 72Z" fill="#2F5D3A"/>' +
    '<path d="M84 70 Q60 20 70 0 Q76 34 88 70Z" fill="#3B7347"/><path d="M84 70 Q130 70 140 100 Q118 80 84 72Z" fill="#3B7347"/>' +
    '<path d="M84 70 Q40 78 30 108 Q52 84 84 72Z" fill="#2F5D3A"/><circle cx="80" cy="76" r="5" fill="#6B4A22"/><circle cx="90" cy="78" r="5" fill="#6B4A22"/></svg>';

  function render(){
    var focused = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.focus : null;
    var people = state.people, yes = [], no = [];
    people.forEach(function(p, i){ (p.yes ? yes : no).push(i); });

    var dom = null, crewIdx = [];
    yes.forEach(function(i){ if (people[i].name === 'Dominik Chmelař') dom = i; else crewIdx.push(i); });
    var crew = crewIdx.map(function(i){
      return '<div class="fig">' + figure(i, true) + '<span class="tag">' + esc(shortName(people[i].name)) + '</span></div>';
    }).join('');

    var used = {};
    var ashore = no.map(function(i, n){
      var idx = (n + (phraseShift[i] || 0)) % PHRASES.length, tries = 0;
      while (used[idx] && tries < PHRASES.length){ idx = (idx + 1) % PHRASES.length; tries++; }
      used[idx] = true;
      var ph = PHRASES[idx];
      return '<button class="fig" type="button" data-shout="'+i+'" data-focus="s'+i+'" aria-label="'+esc(people[i].name)+': '+esc(ph)+'">' +
        '<span class="bubble">' + esc(ph) + '</span>' + figure(i, false) +
        '<span class="tag">' + esc(shortName(people[i].name)) + '</span></button>';
    }).join('');

    var rows = people.map(function(p, i){
      return '<li class="row"><span class="chip" style="background:'+SHIRTS[i % SHIRTS.length]+'">'+esc(initials(p.name))+'</span>' +
        '<span class="nm">'+esc(p.name)+'</span>' +
        '<div class="seg" role="group" aria-label="Hlas: '+esc(p.name)+'">' +
        '<button type="button" data-i="'+i+'" data-v="1" data-focus="y'+i+'" aria-pressed="'+p.yes+'">ANO</button>' +
        '<button type="button" data-i="'+i+'" data-v="0" data-focus="n'+i+'" aria-pressed="'+(!p.yes)+'">NE</button>' +
        '</div></li>';
    }).join('');

    root.innerHTML =
      '<header class="top"><div><h1>Katamarán 2027</h1>' +
      '<p class="lede">Kdo dá ANO, nalodí se a jde se slavit. Kdo zatím ne, mává ze břehu.</p></div>' +
      '<div class="top-side"><p class="tally">Na palubě <b>' + yes.length + '</b> z ' + people.length + '</p>' +
      '<div class="game-links"><button type="button" class="game-link" data-open="panak">🥃 Nalej panáka</button><button type="button" class="game-link" data-open="utek">🏃 Uteč před manželkou</button></div></div></header>' +
      '<section class="scene">' +
        '<div class="sky" aria-label="Na lodi"><div class="moon"></div>' +
          '<h2 class="zone-title">Na lodi <span>(' + yes.length + ')</span></h2>' +
          '<div class="boat-wrap"><div class="boat">' + rig(dom) +
            (crewIdx.length ? '<div class="crew' + (crewIdx.length > 6 ? ' many' : '') + '">' + crew + '</div>' : (dom == null ? '<p class="empty-deck">Paluba je zatím prázdná.</p>' : '')) +
          '</div></div></div>' +
        '<div class="sea"></div>' +
        '<div class="land" aria-label="Na souši">' +
          '<svg class="shore" viewBox="0 0 900 30" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 H900 V12 Q800 26 700 14 T500 16 T300 12 T100 18 T0 12Z" fill="#0A2A44"/></svg>' +
          '<h2 class="zone-title">Na souši <span>(' + no.length + ')</span></h2>' +
          (no.length ? '<div class="ashore">' + ashore + '</div>'
                     : '<p class="all-aboard">Všichni jedou. Na břehu nezůstal nikdo, kdo by mával.</p>') +
          PALM +
        '</div>' +
      '</section>' +
      '<section class="roster"><div class="roster-head"><h2>Kdo jede?</h2>' +
      (changed ? '<button type="button" class="reset" data-reset="1">Vrátit skutečné hlasy</button>' : '') + '</div>' +
      '<p class="status">' + (changed ? 'Zkoušíš si to nanečisto. Změny vidíš jen ty a po obnovení stránky zmizí.' : 'Klikni na ANO nebo NE a uvidíš, jak se kluci přesunou. Nic se neukládá.') + '</p>' +
      '<ul>' + rows + '</ul></section>';

    if (focused){
      var el = root.querySelector('[data-focus="' + focused + '"]');
      if (el) el.focus();
    }
  }


  var ORIGINAL = JSON.stringify(state);
  var changed = false;

  root.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.shout !== undefined){
      var i = +b.dataset.shout; phraseShift[i] = (phraseShift[i] || 0) + 1; render(); return;
    }
    if (b.dataset.reset){
      state = JSON.parse(ORIGINAL); changed = false; render(); return;
    }
    if (b.dataset.i !== undefined){
      var p = state.people[+b.dataset.i], v = b.dataset.v === '1';
      if (p.yes === v) return;
      p.yes = v; changed = JSON.stringify(state) !== ORIGINAL; render();
    }
  });

  render();
})();
</script>

<script id="game-js">
(function(){
  var DRINKS = [
    { name: 'RUM', color: '#B5651D' },
    { name: 'VODKA', color: '#CFE8F2' },
    { name: 'SLIVOVICE', color: '#EBD58F' },
    { name: 'ZELENÁ', color: '#4FA845' },
    { name: 'TUZEMÁK', color: '#8A4B1C' }
  ];
  var names = [];
  try { names = JSON.parse(document.getElementById('state').textContent).people.map(function(p){ return p.name; }); } catch(e){}
  function short(n){ var a = n.split(' '); return a[0] + (a[1] ? ' ' + a[1].charAt(0) + '.' : ''); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function rnd(a){ return a[Math.floor(Math.random() * a.length)]; }
  var $ = function(id){ return document.getElementById(id); };
  var iv = null;

  var stage = $('g-stage'), overlay = $('g-overlay'), svg = $('g-svg');
  var BOTTOM = 266, RIM = 132, H = BOTTOM - RIM, TOL = 6, SAFETY = 8000;
  var pick1 = names.indexOf('Tomáš Cimburek') >= 0 ? 'Tomáš Cimburek' : (names[0] || '');
  var pick2 = names.filter(function(n){ return n !== pick1; })[0] || '';
  var mode = 'setup', target = 70, t = 0, last = 0, raceStart = 0, sleepTimer = null;
  var sides = [];

  function yOf(pct){ return BOTTOM - pct / 100 * H; }

  // ---------- kresba ----------
  function half(i){
    var x = i * 240, p = 'g' + i + '-';
    return '<g transform="translate(' + x + ' 0)">' +
      '<text x="120" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="#F5EFFF" font-family="Bricolage Grotesque, sans-serif" id="' + p + 'name"></text>' +
      '<text x="120" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#F5EFFFaa" font-family="Bricolage Grotesque, sans-serif" id="' + p + 'role"></text>' +
      '<ellipse cx="120" cy="286" rx="70" ry="7" fill="#00000040"/>' +
      '<rect id="' + p + 'stream" x="117.5" y="96" width="5" height="0" rx="2.5" opacity="0"/>' +
      '<g clip-path="url(#g-clip)">' +
        '<rect id="' + p + 'band" x="60" y="0" width="120" height="0" fill="#FFFFFF" opacity=".12"/>' +
        '<rect id="' + p + 'liquid" x="60" y="' + BOTTOM + '" width="120" height="0"/>' +
        '<rect id="' + p + 'foam" x="60" y="' + BOTTOM + '" width="120" height="3" fill="#FFFFFF" opacity=".35"/>' +
      '</g>' +
      '<polygon points="68,128 172,128 156,282 84,282" fill="#FFFFFF" opacity=".08"/>' +
      '<polygon points="68,128 172,128 156,282 84,282" fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="3" stroke-linejoin="round"/>' +
      '<rect x="86" y="266" width="68" height="16" fill="#FFFFFF" opacity=".18"/>' +
      '<path d="M80 142 L90 258" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>' +
      '<g id="' + p + 'target" opacity="0">' +
        '<line id="' + p + 'line" x1="62" y1="0" x2="178" y2="0" stroke="#FFC93C" stroke-width="2.5" stroke-dasharray="6 5"/>' +
      '</g>' +
      '<g id="' + p + 'spill" opacity="0">' +
        '<path id="' + p + 'spill-c" d="M70 128 q-4 14 -2 30 M170 128 q4 14 2 30" stroke-width="5" stroke-linecap="round" fill="none"/>' +
        '<ellipse id="' + p + 'spill-f" cx="120" cy="288" rx="78" ry="6"/>' +
      '</g>' +
      '<g id="' + p + 'bottle" transform="translate(120 92) rotate(-55)">' +
        '<rect x="-2" y="-5" width="6" height="10" rx="2" fill="#2A2F36"/>' +
        '<rect class="' + p + 'glass" x="3" y="-4.5" width="26" height="9"/>' +
        '<path class="' + p + 'glass" d="M29 -4.5 Q35 -14 45 -14 H108 Q114 -14 114 -9 V9 Q114 14 108 14 H45 Q35 14 29 4.5Z"/>' +
        '<rect x="52" y="-10" width="42" height="20" rx="3" fill="#F4EBD0"/>' +
        '<text id="' + p + 'label" x="73" y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="#3A2A1A" font-family="Bricolage Grotesque, sans-serif"></text>' +
        '<rect x="42" y="-11" width="66" height="3.5" rx="1.75" fill="#FFFFFF" opacity=".3"/>' +
      '</g>' +
      '<g id="' + p + 'res" opacity="0"><rect x="60" y="48" width="120" height="30" rx="15" id="' + p + 'res-bg"/>' +
        '<text id="' + p + 'res-t" x="120" y="68" text-anchor="middle" font-size="14" font-weight="800" font-family="Bricolage Grotesque, sans-serif"></text></g>' +
    '</g>';
  }
  svg.innerHTML = '<defs><clipPath id="g-clip"><polygon points="74,132 166,132 152,266 88,266"/></clipPath></defs>' +
    '<line x1="240" y1="10" x2="240" y2="292" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2" stroke-dasharray="4 6"/>' +
    half(0) + half(1);

  function el(i, k){ return $('g' + i + '-' + k); }

  function setDrink(i, d){
    ['liquid', 'stream', 'spill-f'].forEach(function(k){ el(i, k).setAttribute('fill', d.color); });
    el(i, 'spill-c').setAttribute('stroke', d.color);
    svg.querySelectorAll('.g' + i + '-glass').forEach(function(n){ n.setAttribute('fill', d.color); });
    el(i, 'label').textContent = d.name;
    el(i, 'label').setAttribute('font-size', d.name.length > 6 ? 7.5 : 9);
  }

  function paint(){
    sides.forEach(function(s, i){
      var y = yOf(Math.min(s.level, 100));
      el(i, 'liquid').setAttribute('y', y); el(i, 'liquid').setAttribute('height', BOTTOM - y);
      el(i, 'foam').setAttribute('y', y); el(i, 'foam').style.opacity = s.level > 0.5 ? '' : '0';
      el(i, 'stream').setAttribute('opacity', s.holding ? 1 : 0);
      el(i, 'stream').setAttribute('height', Math.max(0, y - 96));
      el(i, 'bottle').setAttribute('transform', 'translate(120 92) rotate(' + s.angle.toFixed(1) + ')');
    });
  }

  function scoreline(){
    var line = $('g-scoreline');
    if (!sides.length || mode !== 'over'){ line.innerHTML = ''; return; }
    line.innerHTML = sides.map(function(s){ return '<span class="pl">' + esc(short(s.name)) + ' <b>' + s.score + '</b></span>'; }).join('<span class="vs">:</span>');
  }

  // ---------- obrazovky ----------
  function show(html){ overlay.innerHTML = html; overlay.hidden = false; overlay.classList.remove('count'); }
  function options(sel){
    return names.map(function(n){ return '<option value="' + esc(n) + '"' + (n === sel ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('');
  }

  function reset(){
    sides = [pick1, pick2].map(function(n, i){
      return { name: n, npc: i === 1, level: 0, holding: false, started: false, done: false, angle: -55, score: 0, stopAt: 0, phase: Math.random() * 6, msg: '' };
    });
    [0, 1].forEach(function(i){
      el(i, 'spill').setAttribute('opacity', 0);
      el(i, 'res').setAttribute('opacity', 0);
      el(i, 'name').textContent = sides[i] ? short(sides[i].name) : '';
      el(i, 'role').textContent = i === 0 ? 'ty' : 'počítač';
    });
  }

  function setupScreen(note){
    clearInterval(iv); clearTimeout(sleepTimer);
    mode = 'setup';
    reset(); paint(); scoreline();
    [0, 1].forEach(function(i){ el(i, 'target').setAttribute('opacity', 0); setDrink(i, DRINKS[i]); });
    $('g-round').textContent = 'Vyber, za koho hraješ a proti komu. Naléváte oba najednou, soupeře ovládá počítač.';
    $('g-msg').textContent = '';
    show('<p class="ov-title">Kdo proti komu?</p>' +
      '<label class="ov-field"><span>Hraju za</span><select id="g-p1">' + options(pick1) + '</select></label>' +
      '<label class="ov-field"><span>Proti (hraje počítač)</span><select id="g-p2">' + options(pick2) + '</select></label>' +
      (note ? '<p class="ov-note">' + esc(note) + '</p>' : '') +
      '<button type="button" data-act="start">Začít</button>');
  }

  function begin(){
    var s1 = $('g-p1'), s2 = $('g-p2');
    if (s1){ pick1 = s1.value; pick2 = s2.value; }
    if (!pick2 || pick1 === pick2) return setupScreen('Vyber dva různé kluky.');
    reset();
    target = 58 + Math.random() * 28;
    var ty = yOf(target);
    [0, 1].forEach(function(i){
      el(i, 'line').setAttribute('y1', ty); el(i, 'line').setAttribute('y2', ty);
      el(i, 'band').setAttribute('y', yOf(target + TOL)); el(i, 'band').setAttribute('height', yOf(target - TOL) - yOf(target + TOL));
      el(i, 'target').setAttribute('opacity', 1);
      setDrink(i, rnd(DRINKS));
    });
    var r = Math.random(), npc = sides[1];
    npc.stopAt = r < 0.12 ? target + TOL * (1.3 + Math.random()) : r < 0.24 ? target - TOL * (1.3 + Math.random()) : target + (Math.random() * 2 - 1) * TOL * 0.95;
    $('g-round').textContent = short(pick1) + ' vs. ' + short(pick2) + ' – kdo bude blíž rysce?';
    $('g-msg').textContent = '';
    scoreline(); paint();
    mode = 'countdown';
    var n = 3;
    overlay.classList.add('count');
    overlay.innerHTML = '<p class="ov-count">3</p>'; overlay.hidden = false;
    clearInterval(iv);
    iv = setInterval(function(){
      n--;
      if (n > 0){ overlay.innerHTML = '<p class="ov-count">' + n + '</p>'; return; }
      clearInterval(iv);
      overlay.hidden = true; overlay.classList.remove('count');
      stage.focus({ preventScroll: true });
      go();
    }, 650);
  }

  function go(){
    mode = 'race'; raceStart = t;
    $('g-msg').textContent = 'Teď! Drž a nalévej…';
    setTimeout(function(){
      var npc = sides[1];
      if (mode === 'race' && !npc.done){ npc.holding = true; npc.started = true; }
    }, 250 + Math.random() * 400);
    clearTimeout(sleepTimer);
    sleepTimer = setTimeout(function(){
      var me = sides[0];
      if (mode === 'race' && !me.started){ me.done = true; me.msg = 'Usnul jsi'; check(); }
    }, SAFETY);
  }

  function stop(i){
    var s = sides[i];
    if (!s.holding) return;
    s.holding = false; s.done = true;
    check();
  }

  function judge(s, i){
    var diff = Math.abs(s.level - target);
    var hit = s.level < 100 && s.started && diff <= TOL;
    var txt, color;
    if (hit){
      s.score = Math.max(10, Math.round(100 - diff / TOL * 70));
      txt = (diff < TOL * 0.25 ? 'Přesně! ' : '') + '+' + s.score;
      color = '#2BB673';
    } else {
      s.score = 0;
      txt = s.msg || (s.level >= 100 ? 'Teče to!' : s.level < target ? 'Málo!' : 'Přelito!');
      color = '#E0485E';
    }
    if (s.level >= 100) el(i, 'spill').setAttribute('opacity', 1);
    el(i, 'res-bg').setAttribute('fill', color);
    el(i, 'res-t').setAttribute('fill', '#FFFFFF');
    el(i, 'res-t').textContent = txt;
    el(i, 'res').setAttribute('opacity', 1);
  }

  function check(){
    if (!sides.every(function(s){ return s.done; })) {
      if (sides[0].done && !sides[1].done) $('g-msg').textContent = 'Čeká se, až dolije ' + short(sides[1].name) + '…';
      return;
    }
    mode = 'judging';
    clearTimeout(sleepTimer);
    setTimeout(function(){
      sides.forEach(judge);
      mode = 'over';
      scoreline();
      var a = sides[0], b = sides[1];
      var title = a.score === b.score ? 'Remíza!' : (a.score > b.score ? 'Vyhrál jsi!' : 'Prohrál jsi!');
      var loser = a.score === b.score ? null : (a.score > b.score ? b : a);
      $('g-msg').textContent = title + ' ' + (loser ? short(loser.name) + ' platí rundu.' : 'Platíte napůl.');
      setTimeout(function(){
        show('<p class="ov-title">' + esc(title) + '</p>' +
          '<p class="ov-score">' + esc(short(a.name)) + ' <b>' + a.score + '</b> : <b>' + b.score + '</b> ' + esc(short(b.name)) + '</p>' +
          (loser ? '<p class="ov-note">' + esc(short(loser.name)) + ' platí rundu.</p>' : '<p class="ov-note">Platíte napůl.</p>') +
          '<div class="ov-row"><button type="button" data-act="start">Odveta</button>' +
          '<button type="button" class="ghost" data-act="setup">Změnit hráče</button></div>');
      }, 1400);
    }, 300);
  }

  overlay.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'start') begin();
    else if (b.dataset.act === 'setup') setupScreen();
  });

  function down(){
    var me = sides[0];
    if (mode === 'race' && me && !me.started){ me.started = true; me.holding = true; $('g-msg').textContent = 'Nalévá se…'; }
  }
  function up(){ if (mode === 'race' && sides[0] && sides[0].holding) stop(0); }

  function tick(now){
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now; t += dt;
    sides.forEach(function(s, i){
      var want = s.holding ? -24 : -55;
      s.angle += (want - s.angle) * Math.min(1, dt * 12);
      if (s.holding && mode === 'race'){
        s.level += 34 * (1 + 0.25 * Math.sin(t * 6 + s.phase)) * dt;
        if (s.level >= 100){ s.level = 100; stop(i); }
        else if (s.npc && s.level >= s.stopAt) stop(i);
      }
    });
    paint();
    requestAnimationFrame(tick);
  }

  stage.addEventListener('pointerdown', function(e){
    if (!overlay.hidden) return;
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch(_){}
    down();
  });
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){ stage.addEventListener(ev, up); });
  stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  stage.addEventListener('keydown', function(e){
    if ((e.key === ' ' || e.key === 'Enter') && overlay.hidden){ e.preventDefault(); if (!e.repeat) down(); }
  });
  stage.addEventListener('keyup', function(e){
    if ((e.key === ' ' || e.key === 'Enter') && overlay.hidden){ e.preventDefault(); up(); }
  });

  setupScreen();
  $('panak').addEventListener('close', function(){ setupScreen(); });
  requestAnimationFrame(tick);
})();
</script>
<dialog class="game-modal" id="utek" aria-labelledby="u-title"><section class="game-wrap">
  <div class="game">
    <button type="button" class="modal-x" data-close aria-label="Zavřít">✕</button>
    <div class="game-head">
      <h2 id="u-title">Uteč před manželkou</h2>
      <p class="game-score" id="u-scoreline"></p>
    </div>
    <p class="game-round" id="u-round">Uhýbej hláškám 30 sekund. Jedna trefa a nikam nejedeš.</p>
    <div class="stage stage-room" id="u-stage" tabindex="0" aria-label="Uteč před manželkou: táhni prstem nebo použij šipky">
      <canvas id="u-canvas"></canvas>
      <div class="overlay" id="u-overlay"></div>
    </div>
    <p class="game-msg" id="u-msg" aria-live="polite"></p>
  </div>
</section></dialog>
<script id="utek-js">
(function(){
  var LINES = [
    'Nikam nejedeš!', 'Kolik to bude stát?', 'Proč nejedou holky?', 'A kdo bude s dětma?',
    'Zase s Dominikem?', 'Slíbil jsi Chorvatsko!', 'Týden?! Zbláznil ses?', 'Co tam budete dělat?',
    'Vždyť neumíš plavat!', 'Mamka říkala, že ne.', 'Kdo poseká zahradu?', 'Budeš mi volat denně!',
    'Hlavně žádný holky!', 'Vyndals nádobí?', 'A kdy jedeme MY?', 'Tchyně přijede!'
  ];
  var SHIRTS = ['#E4572E','#2E86AB','#F2A541','#7B2CBF','#17A398','#D62868','#3D5A80','#8AB17D','#C05746','#4F6D7A'];
  var HAIR = ['#2B1B12','#5A3A22','#1C1C1C','#7A5230','#3B2A1A'];
  var SKIN = ['#F1C9A5','#E8B88F','#F4D2B4','#DDA97F'];
  var DURATION = 30;
  var FONT = '700 13px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif';

  var names = [];
  try { names = JSON.parse(document.getElementById('state').textContent).people.map(function(p){ return p.name; }); } catch(e){}
  function short(n){ var a = n.split(' '); return a[0] + (a[1] ? ' ' + a[1].charAt(0) + '.' : ''); }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function rnd(a){ return a[Math.floor(Math.random() * a.length)]; }
  var $ = function(id){ return document.getElementById(id); };
  var iv = null;

  var stage = $('u-stage'), canvas = $('u-canvas'), ctx = canvas.getContext('2d'), overlay = $('u-overlay');
  var W = 360, H = 440, dpr = 1;
  var pick = names.indexOf('Tomáš Cimburek') >= 0 ? 'Tomáš Cimburek' : (names[0] || 'Kluk');
  var best = 0;
  try { best = +localStorage.getItem('katamaran-utek-best') || 0; } catch(e){}

  var mode = 'setup', elapsed = 0, spawnIn = 0, bubbles = [], last = 0, t = 0;
  var player = { x: 180, tx: 180, vx: 0, step: 0 };
  var wife = { x: 180, tx: 180, throwT: 0 };
  var keys = { left: false, right: false }, hitBubble = null, lineQueue = [];

  function look(name){
    var i = Math.max(0, names.indexOf(name));
    return { shirt: SHIRTS[i % SHIRTS.length], hair: HAIR[i % HAIR.length], skin: SKIN[i % SKIN.length] };
  }

  function resize(){
    dpr = window.devicePixelRatio || 1;
    if (!stage.clientWidth) return;
    W = stage.clientWidth;
    H = Math.round(Math.min(480, Math.max(380, W * 0.9)));
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    player.x = Math.min(Math.max(player.x, 24), W - 24); player.tx = player.x;
    wife.x = Math.min(Math.max(wife.x, 40), W - 40);
    if (mode !== 'play') draw();
  }

  function rr(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  // ---------- kresba ----------
  function drawRoom(){
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#F7E8C9'); g.addColorStop(1, '#EBD3A6');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#00000008';
    for (var x = 0; x < W; x += 28) ctx.fillRect(x, 0, 12, H - 46);
    // obrázek lodi na zdi
    var px = 18, py = 110;
    ctx.fillStyle = '#7A5230'; rr(px - 4, py - 4, 68, 50, 3); ctx.fill();
    ctx.fillStyle = '#7FC4E8'; ctx.fillRect(px, py, 60, 26);
    ctx.fillStyle = '#2E86AB'; ctx.fillRect(px, py + 26, 60, 16);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.moveTo(px + 30, py + 6); ctx.lineTo(px + 30, py + 28); ctx.lineTo(px + 44, py + 28); ctx.closePath(); ctx.fill();
    ctx.fillRect(px + 16, py + 28, 32, 4);
    // podlaha
    ctx.fillStyle = '#B9835A'; ctx.fillRect(0, H - 46, W, 46);
    ctx.fillStyle = '#8A5A3A'; ctx.fillRect(0, H - 50, W, 6);
    ctx.strokeStyle = '#00000018'; ctx.lineWidth = 1;
    for (var k = 0; k < 3; k++){ ctx.beginPath(); ctx.moveTo(0, H - 34 + k * 12); ctx.lineTo(W, H - 34 + k * 12); ctx.stroke(); }
  }

  function drawWife(){
    var x = wife.x, y = 64, throwing = wife.throwT > 0;
    ctx.save(); ctx.translate(x, y);
    // šaty
    ctx.fillStyle = '#B23A6B';
    ctx.beginPath(); ctx.moveTo(-14, 6); ctx.lineTo(14, 6); ctx.lineTo(22, 46); ctx.lineTo(-22, 46); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.moveTo(-8, 14); ctx.lineTo(8, 14); ctx.lineTo(12, 42); ctx.lineTo(-12, 42); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    // ruce, v pravé váleček
    ctx.strokeStyle = '#F1C9A5'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-13, 10); ctx.lineTo(-22, 28); ctx.stroke();
    var a = throwing ? -1.9 : -0.6;
    var hx = 13 + Math.cos(a) * 18, hy = 10 + Math.sin(a) * 18;
    ctx.beginPath(); ctx.moveTo(13, 10); ctx.lineTo(hx, hy); ctx.stroke();
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(a + Math.PI / 2);
    ctx.fillStyle = '#D9A55B'; rr(-14, -4, 28, 8, 4); ctx.fill();
    ctx.fillStyle = '#A8763A'; ctx.fillRect(-19, -2, 5, 4); ctx.fillRect(14, -2, 5, 4);
    ctx.restore();
    // hlava
    ctx.fillStyle = '#F1C9A5'; ctx.beginPath(); ctx.arc(0, -8, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5A3A22';
    ctx.beginPath(); ctx.arc(0, -25, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -10, 13.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    // naštvaný obličej
    ctx.strokeStyle = '#2A1A10'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-8, -12); ctx.lineTo(-2, -9); ctx.moveTo(8, -12); ctx.lineTo(2, -9); ctx.stroke();
    ctx.fillStyle = '#2A1A10';
    ctx.beginPath(); ctx.arc(-4.5, -6, 1.6, 0, Math.PI * 2); ctx.arc(4.5, -6, 1.6, 0, Math.PI * 2); ctx.fill();
    if (throwing){ ctx.fillStyle = '#7A2A2A'; ctx.beginPath(); ctx.ellipse(0, 0, 4, 3.2, 0, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke(); }
    ctx.restore();
  }

  function drawGuy(){
    var lk = look(pick), x = player.x, y = H - 52;
    var moving = Math.abs(player.vx) > 20, sw = moving ? Math.sin(player.step) * 6 : 0;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#00000022'; ctx.beginPath(); ctx.ellipse(0, 2, 18, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#22303A'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-5, -14); ctx.lineTo(-5 - sw, 0); ctx.moveTo(5, -14); ctx.lineTo(5 + sw, 0); ctx.stroke();
    // kufr
    ctx.fillStyle = '#2E86AB'; rr(14, -22, 14, 16, 3); ctx.fill();
    ctx.strokeStyle = '#1C5A75'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(18, -22); ctx.lineTo(18, -26); ctx.lineTo(24, -26); ctx.lineTo(24, -22); ctx.stroke();
    // tělo
    ctx.fillStyle = lk.shirt; rr(-12, -38, 24, 26, 8); ctx.fill();
    ctx.strokeStyle = lk.shirt; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(10, -32); ctx.lineTo(19, -24); ctx.moveTo(-10, -32); ctx.lineTo(-17, -22 + sw * .5); ctx.stroke();
    // hlava
    ctx.fillStyle = lk.skin; ctx.beginPath(); ctx.arc(0, -50, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = lk.hair; ctx.beginPath(); ctx.arc(0, -52, 11.5, Math.PI * 1.05, Math.PI * 1.95); ctx.fill();
    ctx.fillStyle = '#111'; rr(-8, -54, 7, 4.5, 2); ctx.fill(); rr(1, -54, 7, 4.5, 2); ctx.fill();
    ctx.fillRect(-1, -53, 2, 1.5);
    ctx.strokeStyle = '#5B2A1A'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(0, -46, 3.5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.restore();
    // jmenovka
    ctx.font = '700 11px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif';
    var label = short(pick), lw = ctx.measureText(label).width + 12;
    ctx.fillStyle = '#140F3Ad9'; rr(x - lw / 2, H - 40 + 6, lw, 16, 6); ctx.fill();
    ctx.fillStyle = '#F5EFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, x, H - 40 + 14.5);
  }

  function drawBubble(b){
    var hit = b === hitBubble;
    ctx.fillStyle = hit ? '#E0485E' : '#FFFFFF';
    ctx.strokeStyle = hit ? '#A8203A' : '#1E1A2E33'; ctx.lineWidth = 1.5;
    rr(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h, 12); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(b.x - 6, b.y - b.h / 2 + 1); ctx.lineTo(b.x - 1, b.y - b.h / 2 - 7); ctx.lineTo(b.x + 4, b.y - b.h / 2 + 1); ctx.closePath(); ctx.fill();
    ctx.font = FONT; ctx.fillStyle = hit ? '#FFFFFF' : '#1E1A2E'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.text, b.x, b.y + 1);
  }

  function drawHud(){
    var left = Math.max(0, DURATION - elapsed);
    ctx.fillStyle = '#00000014'; ctx.fillRect(0, 0, W, 5);
    ctx.fillStyle = '#17A398'; ctx.fillRect(0, 0, W * Math.min(1, elapsed / DURATION), 5);
    var txt = Math.ceil(left) + ' s';
    ctx.font = '800 15px "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif';
    var w = ctx.measureText(txt).width + 18;
    ctx.fillStyle = left <= 5 ? '#17A398' : '#140F3Ad9'; rr(W - w - 10, 14, w, 26, 13); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, W - w / 2 - 10, 27.5);
  }

  function draw(){
    drawRoom();
    drawWife();
    bubbles.forEach(drawBubble);
    if (hitBubble) drawBubble(hitBubble);
    drawGuy();
    if (mode === 'play' || mode === 'hit' || mode === 'win') drawHud();
  }

  // ---------- hra ----------
  function nextLine(){
    if (!lineQueue.length){
      lineQueue = LINES.slice(1).sort(function(){ return Math.random() - .5; });
      lineQueue.unshift(LINES[0]);
    }
    return lineQueue.shift();
  }

  function spawn(){
    var f = elapsed / DURATION, scale = H / 440;
    ctx.font = FONT;
    var text = nextLine(), w = ctx.measureText(text).width + 22, h = 28;
    var x = Math.min(Math.max(wife.x, w / 2 + 4), W - w / 2 - 4), y = 100;
    var vy = (130 + 170 * f) * scale * (0.9 + Math.random() * 0.25);
    var tReach = (H - 80 - y) / vy;
    var aimX = player.x + (Math.random() * 2 - 1) * 70;
    var vx = (aimX - x) / tReach * (0.55 + Math.random() * 0.5);
    bubbles.push({ x: x, y: y, w: w, h: h, vx: vx, vy: vy, text: text });
    wife.throwT = 0.35;
  }

  function hitTest(b){
    var px1 = player.x - 12, px2 = player.x + 12, py1 = H - 52 - 60, py2 = H - 52;
    var bx1 = b.x - b.w / 2 + 5, bx2 = b.x + b.w / 2 - 5, by1 = b.y - b.h / 2 + 4, by2 = b.y + b.h / 2 - 4;
    return bx1 < px2 && bx2 > px1 && by1 < py2 && by2 > py1;
  }

  function update(dt){
    elapsed += dt;
    var f = elapsed / DURATION;
    // manželka se přesouvá
    if (Math.abs(wife.tx - wife.x) < 4 || Math.random() < dt * 0.6) wife.tx = 40 + Math.random() * (W - 80);
    wife.x += Math.sign(wife.tx - wife.x) * Math.min(Math.abs(wife.tx - wife.x), (90 + 120 * f) * dt);
    wife.throwT = Math.max(0, wife.throwT - dt);
    // házení
    spawnIn -= dt;
    if (spawnIn <= 0){
      spawn();
      if (f > 0.5 && Math.random() < 0.3) setTimeout(function(){ if (mode === 'play') spawn(); }, 180);
      spawnIn = Math.max(0.42, 1.05 - 0.6 * f) * (0.8 + Math.random() * 0.4);
    }
    // hráč
    var prev = player.x;
    if (keys.left || keys.right){
      player.tx = player.x + (keys.right ? 1 : -1) * 460 * dt;
    }
    var d = player.tx - player.x, maxStep = 700 * dt;
    player.x += Math.sign(d) * Math.min(Math.abs(d), maxStep);
    player.x = Math.min(Math.max(player.x, 24), W - 24);
    player.vx = (player.x - prev) / Math.max(dt, 0.001);
    player.step += Math.abs(player.x - prev) * 0.15;
    // bubliny
    for (var i = bubbles.length - 1; i >= 0; i--){
      var b = bubbles[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x - b.w / 2 < 2 || b.x + b.w / 2 > W - 2){ b.vx *= -1; b.x = Math.min(Math.max(b.x, b.w / 2 + 2), W - b.w / 2 - 2); }
      if (hitTest(b)){ return lose(b); }
      if (b.y - b.h / 2 > H) bubbles.splice(i, 1);
    }
    if (elapsed >= DURATION) win();
  }

  function scoreline(){
    $('u-scoreline').innerHTML = best ? '<span>Rekord <b>' + (best >= DURATION ? 'utekl' : best.toFixed(1).replace('.', ',') + ' s') + '</b></span>' : '';
  }

  function saveBest(v){
    if (v > best){ best = v; try { localStorage.setItem('katamaran-utek-best', best); } catch(e){} }
    scoreline();
  }

  function lose(b){
    mode = 'hit'; hitBubble = b;
    bubbles = bubbles.filter(function(x){ return x !== b; });
    var held = Math.min(elapsed, DURATION);
    saveBest(held);
    $('u-msg').textContent = 'Trefila tě: „' + b.text + '“ Nikam nejedeš.';
    draw();
    setTimeout(function(){
      show('<p class="ov-title">Nikam nejedeš!</p>' +
        '<p class="ov-note">Trefila tě hláška „' + esc(b.text) + '“. Vydržel jsi ' + held.toFixed(1).replace('.', ',') + ' s.</p>' +
        '<div class="ov-row"><button type="button" data-act="start">Zkusit znovu</button>' +
        '<button type="button" class="ghost" data-act="setup">Jiný kluk</button></div>');
    }, 700);
  }

  function win(){
    mode = 'win'; elapsed = DURATION;
    saveBest(DURATION);
    bubbles = [];
    $('u-msg').textContent = 'Utekl jsi! ' + short(pick) + ' jede na katamarán.';
    draw();
    setTimeout(function(){
      show('<p class="ov-title">Utekl jsi! 🎉</p>' +
        '<p class="ov-note">' + esc(short(pick)) + ' vydržel 30 sekund a jede na katamarán.</p>' +
        '<div class="ov-row"><button type="button" data-act="start">Ještě jednou</button>' +
        '<button type="button" class="ghost" data-act="setup">Jiný kluk</button></div>');
    }, 500);
  }

  function show(html){ overlay.innerHTML = html; overlay.hidden = false; overlay.classList.remove('count'); }

  function setupScreen(){
    clearInterval(iv);
    mode = 'setup'; bubbles = []; hitBubble = null; elapsed = 0;
    player.x = player.tx = W / 2; wife.x = W / 2;
    $('u-msg').textContent = '';
    scoreline(); draw();
    show('<p class="ov-title">Uteč před manželkou</p>' +
      '<p class="ov-note">Táhni prstem doleva a doprava (na počítači šipky). Uhýbej hláškám 30 sekund.</p>' +
      '<label class="ov-field"><span>Utíká</span><select id="u-pick">' +
      names.map(function(n){ return '<option value="' + esc(n) + '"' + (n === pick ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
      '</select></label><button type="button" data-act="start">Začít</button>');
  }

  function begin(){
    var sel = $('u-pick'); if (sel) pick = sel.value;
    bubbles = []; hitBubble = null; elapsed = 0; spawnIn = 0.6; lineQueue = [];
    player.x = player.tx = W / 2; player.vx = 0; wife.x = W / 2; wife.tx = W / 2;
    $('u-round').textContent = short(pick) + ' chce na katamarán. Manželka je proti.';
    $('u-msg').textContent = '';
    draw();
    var n = 3;
    overlay.classList.add('count');
    overlay.innerHTML = '<p class="ov-count">3</p>'; overlay.hidden = false;
    clearInterval(iv);
    iv = setInterval(function(){
      n--;
      if (n > 0){ overlay.innerHTML = '<p class="ov-count">' + n + '</p>'; return; }
      clearInterval(iv);
      overlay.hidden = true; overlay.classList.remove('count');
      stage.focus({ preventScroll: true });
      mode = 'play'; last = 0;
    }, 600);
  }

  overlay.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'start') begin();
    else if (b.dataset.act === 'setup') setupScreen();
  });

  function pointerX(e){ var r = canvas.getBoundingClientRect(); return e.clientX - r.left; }
  canvas.addEventListener('pointerdown', function(e){
    if (mode !== 'play') return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    player.tx = pointerX(e);
  });
  canvas.addEventListener('pointermove', function(e){
    if (mode !== 'play') return;
    if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) player.tx = pointerX(e);
  });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  stage.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a'){ keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight' || e.key === 'd'){ keys.right = true; e.preventDefault(); }
  });
  stage.addEventListener('keyup', function(e){
    if (e.key === 'ArrowLeft' || e.key === 'a'){ keys.left = false; player.tx = player.x; }
    if (e.key === 'ArrowRight' || e.key === 'd'){ keys.right = false; player.tx = player.x; }
  });

  function tick(now){
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now; t += dt;
    if (mode === 'play'){ update(dt); if (mode === 'play') draw(); }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(function(){ resize(); }).observe(stage);
  $('utek').addEventListener('close', function(){ setupScreen(); });
  resize();
  setupScreen();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (mode !== 'play') draw(); });
  requestAnimationFrame(tick);
})();
</script>
<script id="modal-js">
(function(){
  document.addEventListener('click', function(e){
    var o = e.target.closest('[data-open]');
    if (o){ var d = document.getElementById(o.dataset.open); if (d && !d.open) d.showModal(); return; }
    var c = e.target.closest('[data-close]');
    if (c){ var dd = c.closest('dialog'); if (dd) dd.close(); return; }
    if (e.target.tagName === 'DIALOG' && e.target.open) e.target.close();
  });
})();
</script>
</body>
